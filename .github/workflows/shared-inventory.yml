name: Cross repository shared inventory
on:
  workflow_dispatch:
  push:
    paths: ["SHARED_CODE.json", "tools/check_shared*.py", "tools/test_shared_governance.py", ".github/workflows/shared-inventory.yml"]
  pull_request:
    paths: ["SHARED_CODE.json", "tools/check_shared*.py", "tools/test_shared_governance.py", ".github/workflows/shared-inventory.yml"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          path: repos/bjx-ipo-engine
          repository: KILING-TASI/bjx-ipo-engine
          ref: main
      - uses: actions/checkout@v4
        with:
          path: repos/cn-financial-reconcile
          repository: KILING-TASI/cn-financial-reconcile
          ref: main
      - uses: actions/checkout@v4
        with:
          path: repos/cn-fund-lookthrough
          repository: KILING-TASI/cn-fund-lookthrough
          ref: main
      - uses: actions/checkout@v4
        with:
          path: repos/cn-market-rules
          repository: KILING-TASI/cn-market-rules
          ref: main
      - uses: actions/checkout@v4
        with:
          path: repos/convertible-bond-engine
          repository: KILING-TASI/convertible-bond-engine
          ref: main
      - uses: actions/checkout@v4
        with:
          path: repos/macro-dashboard-engine
          repository: KILING-TASI/macro-dashboard-engine
          ref: main
      - uses: actions/checkout@v4
        with:
          path: repos/marketlens
          repository: KILING-TASI/marketlens
          ref: main
      - uses: actions/checkout@v4
        with:
          path: repos/portfolio-decision-engine
          repository: KILING-TASI/portfolio-decision-engine
          ref: main
      - uses: actions/checkout@v4
        with:
          path: repos/research-workbench
          repository: KILING-TASI/research-workbench
          ref: main
      - uses: actions/checkout@v4
        with:
          path: repos/cn-data-adapters
      - uses: actions/checkout@v4
        with:
          path: repos/cn-reits-research
          repository: KILING-TASI/cn-reits-research
          ref: main
      - uses: actions/checkout@v4
        with:
          path: repos/cn-etf-rotation-engine
          repository: KILING-TASI/cn-etf-rotation-engine
          ref: main
      - run: python repos/cn-data-adapters/tools/test_shared_governance.py
      - run: python repos/cn-data-adapters/tools/check_shared_inventory.py repos/bjx-ipo-engine repos/cn-financial-reconcile repos/cn-fund-lookthrough repos/cn-market-rules repos/convertible-bond-engine repos/macro-dashboard-engine repos/marketlens repos/portfolio-decision-engine repos/research-workbench repos/cn-data-adapters repos/cn-reits-research repos/cn-etf-rotation-engine --output shared-inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-inventory
          path: shared-inventory.json
